# Bir kez çalışır: eski sürüm dallarını Releases'a taşır (bkz. .github/eski_surumler.py). İşi bitince silinecek.
name: Eski sürümleri Releases'a taşı
on:
  push:
    branches: [eleman]
    paths: ['.github/workflows/eski-surumler.yml', '.github/eski_surumler.py', '.github/eski_surumler.json']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tasi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sürümler ve dallar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          python3 .github/eski_surumler.py

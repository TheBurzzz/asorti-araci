<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Asorti Aracı</title>
<link rel="icon" type="image/png" sizes="192x192" href="sistem/asorti.png"><link rel="icon" href="sistem/asorti.ico" sizes="16x16 32x32 48x48 256x256"><link rel="apple-touch-icon" href="sistem/asorti.png">
<style>
:root{--ink:#1d1d1f;--mut:#6e6e73;--line:rgba(60,60,67,.14);--bg:#eef0f6;--bar:rgba(246,247,250,.86);--tabh:rgba(60,60,67,.07);--on:#fff;--acc:#0071e3;--accs:rgba(0,113,227,.12);--ok:#1f9d55;--bad:#d13b30;--pop:rgba(255,255,255,.9);--sh:0 1px 2px rgba(0,0,0,.08),0 3px 10px rgba(30,45,90,.10);--psh:0 18px 50px rgba(20,30,60,.22),0 2px 8px rgba(20,30,60,.10)}
html[data-theme=dark]{--ink:#f5f5f7;--mut:#a1a1a6;--line:rgba(255,255,255,.12);--bg:#0a0c13;--bar:rgba(28,30,38,.88);--tabh:rgba(255,255,255,.07);--on:#3a3f4e;--acc:#0a84ff;--accs:rgba(10,132,255,.22);--ok:#32d17a;--bad:#ff6b61;--pop:rgba(40,43,54,.94);--sh:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);--psh:0 18px 50px rgba(0,0,0,.55),0 2px 8px rgba(0,0,0,.4)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13.5px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
#bar{position:relative;z-index:5;display:flex;align-items:center;gap:10px;height:54px;padding:0 12px 0 14px;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line);user-select:none}
#logo{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;white-space:nowrap;padding-right:6px}
#logo img{width:22px;height:22px;border-radius:6px}
#serit{flex:1;min-width:0;display:flex;align-items:center;gap:6px;align-self:stretch}
#tabs{display:flex;align-items:center;gap:4px;overflow-x:auto;scrollbar-width:none;padding:6px 2px;min-width:0;scroll-behavior:smooth}
#tabs::-webkit-scrollbar{display:none}
.tab{position:relative;display:flex;align-items:center;gap:7px;height:34px;padding:0 8px 0 12px;border-radius:10px;cursor:pointer;white-space:nowrap;max-width:230px;min-width:96px;color:var(--mut);transition:background .18s,color .18s,box-shadow .18s}
.tab:hover{background:var(--tabh);color:var(--ink)}
.tab+.tab:not(.on)::before{content:'';position:absolute;left:-3px;top:9px;bottom:9px;width:1px;background:var(--line)}
.tab.on+.tab::before,.tab:hover::before,.tab:hover+.tab::before{display:none}
.tab.on{background:var(--on);color:var(--ink);font-weight:600;box-shadow:var(--sh),inset 0 0 0 1.5px var(--acc)}
.tab .ad{overflow:hidden;text-overflow:ellipsis;flex:1}
.tab .ad.bos{font-style:italic;font-weight:400}
.tab .ik{width:8px;height:8px;border-radius:50%;flex:none;background:var(--line)}
.tab.on .ik{background:var(--acc)}
.tab .ik.is{background:var(--acc);animation:nb 1.2s ease-in-out infinite}
.tab .ik.ok{background:var(--ok)}
@keyframes nb{50%{opacity:.25}}
.tab .x{flex:none;width:20px;height:20px;border:0;border-radius:6px;background:transparent;color:var(--mut);cursor:pointer;font-size:14px;line-height:20px;padding:0;opacity:0;transition:opacity .15s,background .15s}
.tab:hover .x,.tab.on .x{opacity:1}
.tab .x:hover{background:rgba(220,60,60,.14);color:var(--bad)}
#yeni{flex:none;display:flex;align-items:center;gap:6px;height:32px;padding:0 13px 0 10px;border:0;border-radius:16px;background:var(--accs);color:var(--acc);font-weight:600;cursor:pointer;white-space:nowrap;transition:background .18s,color .18s,transform .12s}
#yeni:hover{background:var(--acc);color:#fff}
#yeni:active{transform:scale(.96)}
#yeni svg{width:16px;height:16px}
#sag{display:flex;align-items:center;gap:8px;white-space:nowrap}
#durum{display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:14px;background:var(--tabh);font-size:12px;color:var(--mut)}
#durum i{width:7px;height:7px;border-radius:50%;background:var(--mut)}
#durum.ok i{background:var(--ok);box-shadow:0 0 0 3px rgba(31,157,85,.18)}
#durum.bad{color:var(--bad)}#durum.bad i{background:var(--bad)}
#durum.bekle i{background:#ff9f0a;animation:nb 1.2s ease-in-out infinite}
#gun{display:none;align-items:center;gap:8px;height:30px;padding:0 4px 0 12px;border-radius:15px;background:var(--accs);color:var(--acc);font-size:12.5px}
#gun.on{display:flex}
#gun a{cursor:pointer;text-decoration:underline;opacity:.8}
#gun button{border:0;border-radius:12px;background:var(--acc);color:#fff;height:24px;padding:0 11px;cursor:pointer;font-weight:600}
#gun button:disabled{opacity:.6;cursor:default}
#ayar{width:32px;height:32px;border:0;border-radius:16px;background:transparent;color:var(--mut);cursor:pointer;display:grid;place-items:center;transition:background .15s,color .15s}
#ayar:hover,#ayar.acik{background:var(--tabh);color:var(--ink)}
#ayar svg{width:19px;height:19px;pointer-events:none}
/* görünüm menüsü */
#menu{position:absolute;top:50px;right:10px;width:320px;padding:14px;border-radius:16px;background:var(--pop);backdrop-filter:saturate(180%) blur(24px);box-shadow:var(--psh);border:1px solid var(--line);opacity:0;transform:translateY(-6px) scale(.98);transform-origin:top right;pointer-events:none;transition:opacity .16s,transform .16s;z-index:20}
#menu.on{opacity:1;transform:none;pointer-events:auto}
#menu h4{margin:2px 2px 8px;font-size:11.5px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;color:var(--mut)}
.blok{padding:10px;border-radius:12px;background:var(--tabh);margin-bottom:12px}
.seg{display:flex;padding:2px;border-radius:9px;background:rgba(120,120,128,.14)}
.seg button{flex:1;height:28px;border:0;border-radius:7px;background:transparent;cursor:pointer;font-size:12.5px;color:var(--ink);transition:background .15s,box-shadow .15s}
.seg button.on{background:var(--on);box-shadow:0 1px 3px rgba(0,0,0,.16);font-weight:600}
/* koyu görünümde seçili düğme belirgin olsun (Apple'ın koyu bölümlü düğmesi gibi: açık gri zemin, beyaz kalın yazı) */
html[data-theme=dark] .seg{background:rgba(118,118,128,.24)}
html[data-theme=dark] .seg button{color:rgba(235,235,245,.7)}
html[data-theme=dark] .seg button:not(.on):hover{color:#fff;background:rgba(255,255,255,.06)}
html[data-theme=dark] .seg button.on{background:#6a6f7e;color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.14)}
.not{font-size:11.5px;color:var(--mut);margin:7px 2px 0}
.satir{display:flex;align-items:center;gap:10px;margin-top:10px}
.satir span{font-size:12px;color:var(--mut)}
input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;background:linear-gradient(90deg,#ffe9b8,#ff9f2e);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.35);cursor:pointer}
input[type=range]:disabled{opacity:.4}
select{flex:1;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--on);color:var(--ink);font:inherit;font-size:12.5px;padding:0 6px}
.kon{margin-top:12px}
.yol{font-size:12.5px;font-weight:600;word-break:break-all;line-height:1.35}
.yol.bos{font-weight:400;color:var(--mut)}
.dug{margin-top:8px}
.dug button{flex:1;height:28px;border:0;border-radius:8px;background:var(--on);box-shadow:0 1px 2px rgba(0,0,0,.12);cursor:pointer;font-size:12.5px;color:var(--ink)}
.dug button:hover{background:var(--accs);color:var(--acc)}
.dug button:disabled{opacity:.5;cursor:default}
.alt{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--mut);padding:0 2px}
.alt button{border:0;background:transparent;color:var(--acc);cursor:pointer;padding:4px 2px}
#sayfalar{position:absolute;top:54px;left:0;right:0;bottom:0}
#sayfalar iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bg)}
#sayfalar iframe.on{display:block}
/* mavi ışık filtresi: her şeyin üstünde, tıklamaları engellemez */
::view-transition-old(root),::view-transition-new(root){animation-duration:.55s;animation-timing-function:cubic-bezier(.4,0,.2,1)}
#gece{position:fixed;inset:0;pointer-events:none;z-index:50;background:#ff8a1c;mix-blend-mode:multiply;opacity:0;transition:opacity .6s}
</style></head><body>
<div id="bar">
 <div id="logo"><img src="sistem/asorti.png" alt="">Asorti Aracı</div>
 <div id="serit"><div id="tabs"></div>
  <button id="yeni" type="button" title="Yeni çalışma sayfası aç (sekme çubuğunda boş yere çift tıklayarak da açılır)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>Yeni sayfa</button></div>
 <div id="sag">
  <div id="gun"><span id="gunYazi"></span><a id="gunNot" title="Bu sürümde neler var">neler yeni?</a><button id="gunBtn" type="button">Güncelle</button></div>
  <div id="durum" title="Gerber köprüsünün durumu"><i></i><span id="durumYazi">Bağlanıyor…</span></div>
  <button id="ayar" type="button" title="Ayarlar: görünüm, gece ışığı, Excel kayıt klasörü, güncelleme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
 </div>
 <div id="menu" role="dialog" aria-label="Ayarlar">
  <h4>Görünüm</h4>
  <div class="blok"><div class="seg" id="tmSeg"><button data-v="acik">☀ Açık</button><button data-v="koyu">☾ Koyu</button><button data-v="oto">Otomatik</button></div>
   <div class="not" id="tmNot"></div>
   <div class="satir kon"><span>Konum</span><select id="konSec" aria-label="Konum"></select></div><div class="not" id="konNot"></div></div>
  <h4>Gece ışığı · mavi ışık filtresi</h4>
  <div class="blok"><div class="seg" id="gcSeg"><button data-v="kapali">Kapalı</button><button data-v="acik">Açık</button><button data-v="oto">Akşamları</button></div>
   <div class="satir"><span>Az</span><input type="range" id="sicak" min="0" max="100" step="1" aria-label="Sarı tonu" title="Çift tıklayınca varsayılan tona döner"><span>Çok sarı</span></div>
   <div class="not" id="gcNot"></div></div>
  <h4>Excel kayıt klasörü</h4>
  <div class="blok"><div class="yol" id="exYol">Yükleniyor…</div>
   <div class="satir dug"><button type="button" id="exSec">Klasör seç…</button><button type="button" id="exAc">Klasörü aç</button></div>
   <div class="not">"Excel dosyasını kaydet" dediğinde dosya sormadan bu klasöre kaydedilir.</div></div>
  <div class="alt"><span id="surum"></span><button id="denetle" type="button">Güncellemeleri denetle</button></div>
 </div>
</div>
<div id="sayfalar"></div>
<div id="gece"></div>
<script>
const $=i=>document.getElementById(i),LS='asorti-sayfalar',LG='asorti-gorunum';
let S=(()=>{try{return JSON.parse(localStorage.getItem(LS)||'null')}catch(e){return null}})()||{list:[],on:''};
const info={};
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function yeniId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,5)}
function frame(id){let f=document.querySelector('iframe[data-id="'+id+'"]');if(!f){f=document.createElement('iframe');f.dataset.id=id;f.src='asorti_araci.html?sayfa='+encodeURIComponent(id);$('sayfalar').appendChild(f)}return f}
function ciz(){const T=$('tabs');T.innerHTML='';S.list.forEach((id,i)=>{const d=info[id]||{},b=document.createElement('div');b.className='tab'+(id===S.on?' on':'');
  const ad=d.ad||'Sayfa '+(i+1),ik=d.busy?'is':(d.bitti?'ok':'');
  b.innerHTML='<span class="ik '+ik+'"></span><span class="ad'+(d.ad?'':' bos')+'"></span><button class="x" title="Sayfayı kapat">×</button>';b.querySelector('.ad').textContent=ad;
  b.title=ad+(d.busy?' · Gerber işi sürüyor':d.bitti?' · Gerber işi bitti':'');
  b.onclick=e=>{if(e.target.classList.contains('x'))return kapat(id);ac(id)};T.appendChild(b)});
 document.querySelectorAll('#sayfalar iframe').forEach(f=>f.classList.toggle('on',f.dataset.id===S.on));
 const a=T.querySelector('.tab.on');if(a)a.scrollIntoView({block:'nearest',inline:'nearest'})}
function ac(id){S.on=id;save();frame(id);ciz()}
function yeni(){const id=yeniId();S.list.push(id);ac(id)}
function kapat(id){const d=info[id]||{};if(!confirm((d.ad?d.ad+' sayfası':'Bu sayfa')+' kapatılsın mı?'+(d.busy?'\n\nDikkat: bu sayfanın Gerber işi hâlâ sürüyor.':'')+'\nSayfadaki bilgiler silinir (Excel\'e kaydettiklerin durur).'))return;
 const i=S.list.indexOf(id);S.list.splice(i,1);const f=document.querySelector('iframe[data-id="'+id+'"]');if(f)f.remove();delete info[id];
 try{localStorage.removeItem('asorti-sayfa-'+id);localStorage.removeItem('asorti-gjob-'+id)}catch(e){}
 if(!S.list.length)return yeni();if(S.on===id)S.on=S.list[Math.max(0,i-1)];save();frame(S.on);ciz()}
$('yeni').onclick=yeni;
$('serit').addEventListener('dblclick',e=>{if(e.target===$('serit')||e.target===$('tabs'))yeni()});
$('tabs').addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){$('tabs').scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false});
window.addEventListener('message',e=>{const d=e.data||{};
 if(d.t==='exKlasor'){document.querySelectorAll('#sayfalar iframe').forEach(f=>{if(f.contentWindow!==e.source)try{f.contentWindow.postMessage(d,'*')}catch(x){}});if($('menu').classList.contains('on'))exGoster()}
 if(d.t==='sayfa'&&S.list.includes(d.id)){const o=info[d.id]||{};if(o.ad!==d.ad||o.busy!==d.busy||o.bitti!==d.bitti){info[d.id]={ad:d.ad,busy:d.busy,bitti:d.bitti};ciz()}}
 if(d.t==='tema'){G0.tema=d.v==='dark'?'koyu':'acik';kaydet();uygula()}});

/* ---------- görünüm: tema, otomatik gece modu, mavi ışık filtresi ---------- */
let G0=Object.assign({tema:'acik',gece:'kapali',sicak:50,konum:null},(()=>{try{return JSON.parse(localStorage.getItem(LG)||'{}')}catch(e){return{}}})());
try{const t=localStorage.getItem('asorti-tema');if(!localStorage.getItem(LG)&&t)G0.tema=t==='dark'?'koyu':'acik'}catch(e){}
function kaydet(){try{localStorage.setItem(LG,JSON.stringify(G0))}catch(e){}}
/* konum: gün doğumu / batımı bulunduğun ile göre hesaplanır.
   Önce bilgisayarın konumu (Windows konum hizmeti), olmazsa internet bağlantısının konumu; istersen menüden il seçilir. */
const ILLER=[["Adana",36.986,35.325],["Adıyaman",37.76,38.277],["Afyonkarahisar",38.757,30.539],["Ağrı",39.719,43.05],["Amasya",40.65,35.833],["Ankara",39.921,32.854],["Antalya",36.887,30.703],["Artvin",41.183,41.829],["Aydın",37.848,27.844],["Balıkesir",39.647,27.888],["Bilecik",40.144,29.975],["Bingöl",38.886,40.497],["Bitlis",38.402,42.108],["Bolu",40.733,31.611],["Burdur",37.725,30.289],["Bursa",40.183,29.068],["Çanakkale",40.146,26.403],["Çankırı",40.597,33.621],["Çorum",40.55,34.954],["Denizli",37.783,29.097],["Diyarbakır",37.916,40.236],["Edirne",41.676,26.559],["Elazığ",38.675,39.223],["Erzincan",39.747,39.491],["Erzurum",39.906,41.273],["Eskişehir",39.774,30.519],["Gaziantep",37.063,37.379],["Giresun",40.917,38.385],["Gümüşhane",40.462,39.476],["Hakkari",37.577,43.738],["Hatay",36.203,36.16],["Isparta",37.764,30.555],["Mersin",36.798,34.63],["İstanbul",41.006,28.976],["İzmir",38.419,27.128],["Kars",40.607,43.095],["Kastamonu",41.377,33.777],["Kayseri",38.722,35.487],["Kırklareli",41.737,27.224],["Kırşehir",39.146,34.161],["Kocaeli",40.765,29.941],["Konya",37.873,32.492],["Kütahya",39.42,29.986],["Malatya",38.349,38.319],["Manisa",38.613,27.433],["Kahramanmaraş",37.581,36.928],["Mardin",37.313,40.735],["Muğla",37.215,28.364],["Muş",38.732,41.49],["Nevşehir",38.625,34.715],["Niğde",37.97,34.676],["Ordu",40.985,37.88],["Rize",41.025,40.52],["Sakarya",40.773,30.404],["Samsun",41.295,36.332],["Siirt",37.927,41.942],["Sinop",42.027,35.151],["Sivas",39.75,37.015],["Tekirdağ",40.978,27.511],["Tokat",40.323,36.552],["Trabzon",41.005,39.73],["Tunceli",39.106,39.548],["Şanlıurfa",37.16,38.792],["Uşak",38.674,29.406],["Van",38.501,43.395],["Yozgat",39.822,34.808],["Zonguldak",41.453,31.788],["Aksaray",38.371,34.027],["Bayburt",40.255,40.221],["Karaman",37.181,33.219],["Kırıkkale",39.841,33.506],["Batman",37.884,41.128],["Şırnak",37.522,42.457],["Bartın",41.635,32.337],["Ardahan",41.11,42.704],["Iğdır",39.922,44.047],["Yalova",40.658,29.27],["Karabük",41.196,32.623],["Kilis",36.717,37.115],["Osmaniye",37.073,36.251],["Düzce",40.839,31.16]];
const SICAK0=50;
let KONUM={ad:'İstanbul',lat:41.006,lon:28.976};
function enYakin(lat,lon){let b=null,bd=1e9;for(const [ad,a,o] of ILLER){const d=(a-lat)**2+((o-lon)*Math.cos(lat*Math.PI/180))**2;if(d<bd){bd=d;b={ad,lat:a,lon:o}}}return b}
function konumAyarla(k,kaynak){if(!k)return;KONUM={ad:k.ad,lat:k.lat,lon:k.lon};G0.konum={ad:k.ad,lat:k.lat,lon:k.lon,kaynak,t:Date.now()};kaydet();uygula()}
let konumAraniyor=false;
async function konumBul(zorla){const k=G0.konum;if(k&&k.kaynak==='elle'&&!zorla){KONUM=k;return}
 if(k&&!zorla&&Date.now()-k.t<7*864e5){KONUM=k;return}
 if(konumAraniyor)return;konumAraniyor=true;$('konNot').textContent='Konum bulunuyor…';
 const gps=await new Promise(res=>{if(!navigator.geolocation)return res(null);navigator.geolocation.getCurrentPosition(p=>res(p.coords),()=>res(null),{timeout:9000,maximumAge:864e5})});
 if(gps){const e=enYakin(gps.latitude,gps.longitude);konumAyarla({ad:e.ad,lat:gps.latitude,lon:gps.longitude},'gps')}
 else{try{const j=await (await fetch('/konum',{cache:'no-store'})).json();if(j&&isFinite(j.lat)&&isFinite(j.lon)){const e=enYakin(+j.lat,+j.lon);konumAyarla({ad:e.ad,lat:+j.lat,lon:+j.lon},'ip')}else throw 0}
  catch(e){if(k)KONUM=k;$('konNot').textContent='Konum bulunamadı; listeden ilini seçebilirsin.'}}
 konumAraniyor=false;uygula()}
function konumListesi(){const s=$('konSec');s.innerHTML='<option value="">📍 Otomatik bul</option>'+ILLER.map(([ad])=>'<option>'+ad+'</option>').join('')}
konumListesi();
$('konSec').onchange=e=>{const v=e.target.value;if(!v){G0.konum=null;kaydet();konumBul(true);return}const i=ILLER.find(x=>x[0]===v);if(i)konumAyarla({ad:i[0],lat:i[1],lon:i[2]},'elle')};
function gunes(t){const r=Math.PI/180,jd=t.getTime()/864e5+2440587.5,n=Math.round(jd-2451545.0009-KONUM.lon/360),J=n+KONUM.lon/-360,
  M=(357.5291+0.98560028*J)%360,C=1.9148*Math.sin(M*r)+0.02*Math.sin(2*M*r)+0.0003*Math.sin(3*M*r),L=(M+C+282.9372)%360,
  Jt=2451545.0009+J+0.0053*Math.sin(M*r)-0.0069*Math.sin(2*L*r),d=Math.asin(Math.sin(L*r)*Math.sin(23.4397*r)),
  w=Math.acos((Math.sin(-0.833*r)-Math.sin(KONUM.lat*r)*Math.sin(d))/(Math.cos(KONUM.lat*r)*Math.cos(d)))/r,tj=j=>new Date((j-2440587.5)*864e5);
 return{dogus:tj(Jt-w/360),batis:tj(Jt+w/360)}}
const saat=d=>String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
function gecemi(){const g=gunes(new Date()),s=new Date();return s<g.dogus||s>=g.batis}
let sonTema='';
function temaYolla(f,t){try{f.contentWindow.postMessage({t:'tema',v:t},'*')}catch(e){}}
/* açık ↔ koyu geçişi: ekran birden kararmasın / aydınlanmasın, yarım saniyede yumuşakça geçsin */
function temaGec(t,yumusak){const yap=()=>{document.documentElement.dataset.theme=t;
  document.querySelectorAll('#sayfalar iframe').forEach(f=>{try{f.contentDocument.documentElement.dataset.theme=t}catch(e){}temaYolla(f,t)})};
 if(yumusak&&document.startViewTransition&&!document.hidden){try{document.startViewTransition(yap);return}catch(e){}}
 yap()}
function uygula(){const gn=gunes(new Date()),gc=gecemi(),t=G0.tema==='oto'?(gc?'dark':'light'):(G0.tema==='koyu'?'dark':'light');
 if(t!==sonTema){const ilk=!sonTema;sonTema=t;try{localStorage.setItem('asorti-tema',t)}catch(e){}temaGec(t,!ilk)}
 const filtre=G0.gece==='acik'||(G0.gece==='oto'&&gc);$('gece').style.opacity=filtre?(G0.sicak/100*0.42).toFixed(3):'0';
 document.querySelectorAll('#tmSeg button').forEach(b=>b.classList.toggle('on',b.dataset.v===G0.tema));
 document.querySelectorAll('#gcSeg button').forEach(b=>b.classList.toggle('on',b.dataset.v===G0.gece));
 $('sicak').value=G0.sicak;$('sicak').disabled=G0.gece==='kapali';
 $('tmNot').textContent=G0.tema==='oto'?'Gün doğumunda açık, gün batımında koyu olur. Bugün ☀ '+saat(gn.dogus)+' · ☾ '+saat(gn.batis):G0.tema==='koyu'?'Koyu görünüm hep açık.':'Açık görünüm hep açık.';
 const k=G0.konum;$('konSec').value=k&&k.kaynak==='elle'?k.ad:'';
 if(!konumAraniyor)$('konNot').textContent=k?(k.kaynak==='elle'?k.ad+' (elle seçildi)':k.ad+' · otomatik bulundu'+(k.kaynak==='ip'?' (internet bağlantısından)':'')):'Konum henüz bulunmadı: İstanbul saatleri kullanılıyor.';
 $('gcNot').textContent=G0.gece==='oto'?'Gün batımından ('+saat(gn.batis)+') gün doğumuna kadar ekran sarı tona döner.':G0.gece==='acik'?'Ekran sarı tonda; akşamları gözü daha az yorar.':'Ekran renkleri olduğu gibi.'}
document.querySelectorAll('#tmSeg button').forEach(b=>b.onclick=()=>{G0.tema=b.dataset.v;kaydet();uygula();if(G0.tema==='oto')konumBul()});
document.querySelectorAll('#gcSeg button').forEach(b=>b.onclick=()=>{G0.gece=b.dataset.v;kaydet();uygula();if(G0.gece==='oto')konumBul()});
$('sicak').oninput=e=>{G0.sicak=+e.target.value;kaydet();uygula()};
$('sicak').ondblclick=()=>{G0.sicak=SICAK0;kaydet();uygula()};
document.addEventListener('load',e=>{if(e.target.tagName==='IFRAME')temaYolla(e.target,document.documentElement.dataset.theme)},true);
if(G0.konum)KONUM=G0.konum;
uygula();setInterval(uygula,60000);
if(G0.tema==='oto'||G0.gece==='oto')konumBul();
function menu(on){$('menu').classList.toggle('on',on);$('ayar').classList.toggle('acik',on);if(on)exGoster()}
/* Excel kayıt klasörü (sunucu kullanici.json'da tutar; sayfalara da haber verilir) */
function exYaz(j){const e=$('exYol');if(!j||!j.klasor){e.textContent='Seçilmedi (ilk kaydette sorulur)';e.className='yol bos';$('exAc').disabled=true;return}
 e.textContent=j.klasor+(j.var?'':'  (klasör bulunamadı)');e.className='yol';e.title=j.klasor;$('exAc').disabled=!j.var}
async function exGoster(){try{exYaz(await (await fetch('/excel/klasor',{cache:'no-store'})).json())}catch(e){$('exYol').textContent='Okunamadı'}}
$('exSec').onclick=async e=>{e.stopPropagation();const b=$('exSec');b.disabled=true;b.textContent='Pencere açıldı…';
 try{const j=await (await fetch('/excel/klasor-sec',{method:'POST',body:'{}',cache:'no-store'})).json();exYaz(j);
  if(!j.iptal)document.querySelectorAll('#sayfalar iframe').forEach(f=>{try{f.contentWindow.postMessage({t:'exKlasor',klasor:j.klasor},'*')}catch(x){}})}catch(x){}
 b.disabled=false;b.textContent='Klasör seç…'};
$('exAc').onclick=async e=>{e.stopPropagation();try{await fetch('/excel/ac?ad=&nasil=klasor',{method:'POST',body:'{}'})}catch(x){}};
$('ayar').onclick=e=>{e.stopPropagation();menu(!$('menu').classList.contains('on'))};
document.addEventListener('click',e=>{if(!$('menu').contains(e.target))menu(false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape')menu(false)});
window.addEventListener('blur',()=>menu(false));

/* ---------- sunucuya "pencere açık" haberi: pencere kapanınca köprü ve Batch de kapanır ---------- */
/* Arka plandaki program yeniden başlarsa (güncelleme vb.) sayfa bunu kimliğinden anlar ve kendini tazeler.
   Kısa kopmalarda kırmızı uyarı çıkmaz; sadece uzun süre hiç cevap gelmezse çıkar. */
let guncelleniyor=false,yenileniyor=false,sunucuId=null,kopukBas=0,hizliT=null,yaziKilit=0;
const bekle=ms=>new Promise(r=>setTimeout(r,ms));
function durumYaz(c,t,ipucu){const d=$('durum');d.className=c;$('durumYazi').textContent=t;d.title=ipucu||'Gerber köprüsünün durumu'}
function sayfalarKaydetsin(){document.querySelectorAll('#sayfalar iframe').forEach(f=>{try{f.contentWindow.postMessage({t:'kaydet'},'*')}catch(e){}})}
function tazele(){if(yenileniyor)return;yenileniyor=true;durumYaz('bekle','Yenileniyor…');sayfalarKaydetsin();setTimeout(()=>location.reload(),300)}
async function nabiz(){if(yenileniyor)return;
 try{const r=await fetch('/nabiz',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();
  kopukBas=0;clearTimeout(hizliT);
  if(j.id&&sunucuId&&j.id!==sunucuId&&!guncelleniyor){tazele();return}   // program yeniden başlamış: sayfayı kendiliğinden tazele
  if(j.id)sunucuId=j.id;
  if(guncelleniyor||Date.now()<yaziKilit)return;
  if(j.gerber===false)durumYaz('','Sadece asorti');
  else durumYaz(j.kopru?'ok':'bad',j.kopru?'Gerber bağlı':'Gerber köprüsü kapalı')}
 catch(e){if(!kopukBas)kopukBas=Date.now();
  if(guncelleniyor)durumYaz('bekle','Güncelleniyor…');
  else if(Date.now()-kopukBas<25000)durumYaz('bekle','Yeniden bağlanıyor…','Arka plandaki programa ulaşılamadı, tekrar deneniyor. Gelince sayfa kendiliğinden yenilenir.');
  else durumYaz('bad','Bağlantı kurulamadı: pencereyi kapatıp yeniden aç','Arka plandaki program 25 saniyedir cevap vermiyor. Pencereyi kapatıp masaüstündeki Asorti Aracı simgesinden aç. Çalışma sayfaların kayıtlı.');
  clearTimeout(hizliT);hizliT=setTimeout(nabiz,1000)}}
/* güncellemeden sonra sayfa açılınca kısa bir "güncellendi" yazısı */
try{const g=sessionStorage.getItem('asorti-guncellendi');if(g){sessionStorage.removeItem('asorti-guncellendi');yaziKilit=Date.now()+6000;durumYaz('ok','v'+g+' sürümüne güncellendi');setTimeout(nabiz,6100)}}catch(e){}
nabiz();setInterval(nabiz,5000);
window.addEventListener('pagehide',()=>{try{navigator.sendBeacon('/kapaniyor','x')}catch(e){}});
window.addEventListener('beforeunload',e=>{if(yenileniyor)return;if(Object.values(info).some(d=>d.busy)){e.preventDefault();e.returnValue=''}});

/* ---------- güncelleme: GitHub'da yeni sürüm varsa üstte "Güncelle" çıkar ---------- */
let G=null;
async function surumYaz(){try{const j=await (await fetch('/surum',{cache:'no-store'})).json();$('surum').textContent=j.surum?'Asorti Aracı v'+j.surum:'';$('denetle').style.display=j.guncelleme?'':'none';return j}catch(e){return null}}
async function gunKontrol(taze){try{const j=await (await fetch('/guncelleme'+(taze?'?taze=1':''),{cache:'no-store'})).json();
  if(j.var){G=j;$('gunYazi').innerHTML='Yeni sürüm <b>v'+j.yeni+'</b>';$('gun').classList.add('on')}else{G=null;$('gun').classList.remove('on')}return j}catch(e){return{hata:e.message}}}
$('denetle').onclick=async()=>{const b=$('denetle');b.textContent='Denetleniyor…';const j=await gunKontrol(true);b.textContent=j&&j.hata?'Ulaşılamadı, tekrar dene':j&&j.var?'Yeni sürüm var ↑':'Güncel ✓';setTimeout(()=>b.textContent='Güncellemeleri denetle',4000)};
$('gunNot').onclick=()=>{if(G)alert('v'+G.yeni+(G.tarih?' · '+G.tarih:'')+'\n\n'+((G.notlar||[]).map(x=>'• '+x).join('\n')||'Not yazılmamış.'))};
$('gunBtn').onclick=async()=>{if(!G)return;
  if(Object.values(info).some(d=>d.busy)){alert('Gerber\'e gönderilen pastallar var. Onlar bitince güncelle.');return}
  if(!confirm('Asorti Aracı v'+G.yeni+' sürümüne güncellensin mi?\n\nÇalışma sayfaların ve ayarların korunur. Pencere birkaç saniye içinde kendiliğinden yenilenir, kapatıp açman gerekmez.'))return;
  const b=$('gunBtn'),hedef=G.yeni,eskiId=sunucuId;
  const birak=m=>{guncelleniyor=false;b.disabled=false;b.textContent='Güncelle';nabiz();if(m)alert(m)};
  b.disabled=true;b.textContent='Güncelleniyor…';guncelleniyor=true;durumYaz('bekle','Güncelleniyor…');
  sayfalarKaydetsin();
  let hata=null;
  try{const j=await (await fetch('/guncelle',{method:'POST',body:'{}',cache:'no-store'})).json();if(!j.ok)hata=j.hata||'bilinmeyen hata'}
  catch(e){/* cevap yolda kaybolduysa güncelleme yine de olmuş olabilir: aşağıda yeni programın açılmasına bakılır */}
  if(hata){birak(/^Güncellenemedi/.test(hata)?hata:'Güncellenemedi: '+hata);return}
  /* Yeni sürümün programı açılana kadar bekle. Sayfa ancak yeni program cevap verince yenilenir;
     boşlukta yenilenirse tarayıcının "bağlanılamadı" sayfası açılırdı. */
  await bekle(800);const t0=Date.now();let yeniAcik=false,surum=null;
  while(Date.now()-t0<90000){
    try{const r=await fetch('/nabiz',{cache:'no-store'});if(r.ok){const j=await r.json();
      if(eskiId?(j.id&&j.id!==eskiId):true){const v=await (await fetch('/surum',{cache:'no-store'})).json();surum=v.surum;
        if(eskiId||surum===hedef){yeniAcik=true;break}}}}catch(e){}
    if(!eskiId&&Date.now()-t0>20000&&surum)break;
    await bekle(400)}
  if(!yeniAcik){if(surum)birak('Güncelleme tamamlanamadı. Birazdan tekrar dene.');else birak();return}   // program hiç açılmadıysa nabız durumu gösterir; açılınca sayfa kendini tazeler
  try{if(surum===hedef)sessionStorage.setItem('asorti-guncellendi',hedef)}catch(e){}
  yenileniyor=true;sayfalarKaydetsin();setTimeout(()=>location.reload(),200)};
surumYaz().then(j=>{if(j&&j.guncelleme){gunKontrol(false);setInterval(()=>gunKontrol(false),2*3600*1000)}});

if(!S.list.length)yeni();else{S.list.forEach(frame);if(!S.list.includes(S.on))S.on=S.list[0];ac(S.on)}
</script></body></html>
